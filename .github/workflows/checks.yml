name: Library checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  library:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
      - run: python scripts/check_typst.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
