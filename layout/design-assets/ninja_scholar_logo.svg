<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!--
    VietPhys Ninja Scholar Logo v2
    Các nét vẽ Bézier mượt mà, trơn tru.
    - "currentColor" → Màu chủ đạo (thân ninja, vòng tròn chính, sách)
    - "var(--accent, #B08D57)" → Màu phụ (vòng phía sau, bìa sách ngoài)
    Khi dùng trong Typst: replace chuỗi bằng mã hex theme tương ứng.
  -->

  <!-- ============================================================ -->
  <!-- LỚP 1: VÒNG BRUSH PHỤ PHÍA SAU (ACCENT)                     -->
  <!-- ============================================================ -->
  <!-- Đoạn cung phải-trên xuống phải-dưới, nét thư pháp dày → mỏng -->
  <path d="
    M 375 105
    C 420 145, 448 200, 450 260
    C 452 320, 430 375, 385 410
    C 365 425, 340 432, 315 430
  " fill="none" stroke="var(--accent, #B08D57)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Đuôi mỏng dần -->
  <path d="
    M 315 430
    C 290 425, 268 415, 248 398
  " fill="none" stroke="var(--accent, #B08D57)" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

  <!-- ============================================================ -->
  <!-- LỚP 2: VÒNG BRUSH CHÍNH (PRIMARY / currentColor)             -->
  <!-- Vòng mở 300°, hở ở góc phải-trên, nét từ dày → mỏng          -->
  <!-- ============================================================ -->
  <!-- Phần chính: từ 1h → xuôi ngược kim đồng hồ quanh 1 vòng -->
  <path d="
    M 348 72
    C 300 55, 230 52, 170 80
    C 110 110, 70 168, 60 235
    C 50 305, 72 370, 125 415
    C 175 458, 240 468, 310 448
  " fill="none" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Đuôi cong nhỏ mỏng dần -->
  <path d="
    M 310 448
    C 335 440, 358 425, 375 405
  " fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round"/>

  <!-- Mũi nét cọ vào (nhọn lên rồi dày) -->
  <path d="
    M 370 78
    C 362 74, 355 72, 348 72
  " fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>

  <!-- ============================================================ -->
  <!-- LỚP 3: ĐẦU NINJA (KHỐI TRÒN)                                -->
  <!-- ============================================================ -->
  <circle cx="250" cy="180" r="66" fill="currentColor"/>

  <!-- ============================================================ -->
  <!-- LỚP 4: BĂNG ĐẦU NINJA (HITAI-ATE) + MẮT                     -->
  <!-- ============================================================ -->
  <!-- Băng trắng ngang trán, bo mềm theo đầu tròn -->
  <path d="
    M 180 190
    C 195 172, 222 162, 250 162
    C 278 162, 305 172, 320 190
    C 310 180, 285 172, 250 172
    C 215 172, 190 180, 180 190
    Z
  " fill="white" opacity="0.92"/>

  <!-- Khe mắt trái — hình quả trám sắc nét -->
  <path d="
    M 206 184
    L 230 178
    L 238 183
    L 230 189
    Z
  " fill="white"/>

  <!-- Khe mắt phải — hình quả trám sắc nét -->
  <path d="
    M 262 183
    L 270 178
    L 294 184
    L 270 189
    Z
  " fill="white"/>

  <!-- ============================================================ -->
  <!-- LỚP 5: DẢI BĂNG BAY PHÍA SAU ĐẦU                            -->
  <!-- Hai dải lụa uốn mượt bằng cubic bezier                       -->
  <!-- ============================================================ -->
  <!-- Dải 1 (dày, gần) -->
  <path d="
    M 318 186
    C 338 175, 355 162, 365 148
    C 372 138, 378 126, 382 115
  " fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>

  <!-- Dải 2 (mỏng, xa) -->
  <path d="
    M 330 180
    C 348 168, 368 148, 380 130
    C 388 118, 395 105, 398 95
  " fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>

  <!-- ============================================================ -->
  <!-- LỚP 6: THÂN NINJA (VAI + CỔ + ÁO)                           -->
  <!-- Silhouette vai rộng, eo thon, nét cong mượt mà               -->
  <!-- ============================================================ -->
  <path d="
    M 185 228
    C 200 220, 225 212, 250 212
    C 275 212, 300 220, 315 228
    C 328 238, 342 258, 350 278
    C 355 290, 354 300, 348 306
    C 338 314, 322 310, 312 298
    C 306 290, 300 278, 294 270
    C 282 264, 265 260, 250 258
    C 235 260, 218 264, 206 270
    C 200 278, 194 290, 188 298
    C 178 310, 162 314, 152 306
    C 146 300, 145 290, 150 278
    C 158 258, 172 238, 185 228
    Z
  " fill="currentColor"/>

  <!-- ============================================================ -->
  <!-- LỚP 7: SÁCH MỞ — hai trang cong mềm + bìa accent            -->
  <!-- ============================================================ -->
  
  <!-- Bìa ngoài trái (accent) -->
  <path d="
    M 250 328
    C 225 316, 185 306, 140 312
    C 110 316, 85 328, 72 342
    L 60 334
    C 76 316, 105 302, 140 296
    C 185 290, 225 300, 250 315
    Z
  " fill="var(--accent, #B08D57)" opacity="0.7"/>

  <!-- Bìa ngoài phải (accent) -->
  <path d="
    M 250 328
    C 275 316, 315 306, 360 312
    C 390 316, 415 328, 428 342
    L 440 334
    C 424 316, 395 302, 360 296
    C 315 290, 275 300, 250 315
    Z
  " fill="var(--accent, #B08D57)" opacity="0.7"/>

  <!-- Trang sách trái (primary) -->
  <path d="
    M 250 328
    C 228 318, 190 310, 148 316
    C 118 322, 95 334, 82 348
    L 98 392
    C 110 378, 132 368, 158 364
    C 192 358, 228 364, 250 378
    Z
  " fill="currentColor" opacity="0.82"/>

  <!-- Trang sách phải (primary) -->
  <path d="
    M 250 328
    C 272 318, 310 310, 352 316
    C 382 322, 405 334, 418 348
    L 402 392
    C 390 378, 368 368, 342 364
    C 308 358, 272 364, 250 378
    Z
  " fill="currentColor" opacity="0.82"/>

  <!-- Gáy sách (đường sống giữa) -->
  <line x1="250" y1="320" x2="250" y2="385" stroke="white" stroke-width="2" opacity="0.5"/>

</svg>
